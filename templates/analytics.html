{% extends "base.html" %}
{% block title %}분석{% endblock %}
{% block page_title %}<span data-ko="분석" data-en="Analytics">분석</span>{% endblock %}

{% block content %}

<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
  <div class="pill-tabs" id="range-tabs">
    <button class="ptab active" data-range="24h" data-ko="24시간" data-en="24h">24시간</button>
    <button class="ptab" data-range="7d"  data-ko="7일"   data-en="7d">7일</button>
    <button class="ptab" data-range="30d" data-ko="30일"  data-en="30d">30일</button>
  </div>
</div>

<div class="pred-card">
  <h3 data-ko="관개 예측" data-en="Irrigation Prediction">관개 예측</h3>
  <div class="pred-time" id="pred-time">약 3시간 후</div>
  <div style="font-size:.76rem;opacity:.75;margin-top:3px" data-ko="현재 수분 감소 속도 기준" data-en="Based on current moisture decline rate">현재 수분 감소 속도 기준</div>
  <div class="pred-bar-wrap"><div class="pred-bar-fill" id="pred-fill"></div></div>
</div>

<div class="stats-row">
  <div class="stat-mini card">
    <div class="smv" id="sc-avg">—</div>
    <div class="sml" data-ko="평균 토양 수분" data-en="Avg Soil Moisture">평균 토양 수분</div>
  </div>
  <div class="stat-mini card">
    <div class="smv" id="sc-irr">—</div>
    <div class="sml" data-ko="총 관수 횟수" data-en="Total Irrigations">총 관수 횟수</div>
  </div>
  <div class="stat-mini card">
    <div class="smv" id="sc-disease" style="font-size:1rem;font-weight:800;color:var(--accent)">—</div>
    <div class="sml" data-ko="가장 많이 감지된 질병" data-en="Most Detected Disease">가장 많이 감지된 질병</div>
  </div>
  <div class="stat-mini card">
    <div class="smv" id="sc-interval">—</div>
    <div class="sml" data-ko="평균 관수 간격" data-en="Avg Irrigation Interval">평균 관수 간격</div>
  </div>
</div>

<div class="card">
  <div class="card-label" style="display:flex;align-items:center;justify-content:space-between">
    <span data-ko="토양 수분 트렌드" data-en="Soil Moisture Trend">토양 수분 트렌드</span>
    <span id="range-lbl" style="font-size:.65rem;color:var(--text-2)">24시간</span>
  </div>
  <div class="chart-wrap" style="height:250px"><canvas id="trendChart"></canvas></div>
</div>

<div class="analytics-grid" style="gap:20px">
  <div class="card">
    <div class="card-label" data-ko="관수 빈도" data-en="Irrigation Frequency">관수 빈도</div>
    <div class="chart-wrap" style="height:210px"><canvas id="irrChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-label" data-ko="질병 감지 이력" data-en="Disease Detection History">질병 감지 이력</div>
    <div class="chart-wrap" style="height:210px"><canvas id="pieChart"></canvas></div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let trendC=null, irrC=null, pieC=null;
const RL = { '24h':{ko:'24시간',en:'24h'}, '7d':{ko:'7일',en:'7d'}, '30d':{ko:'30일',en:'30d'} };

function buildCharts(d) {
  const g = '#3D7A4F';
  if (trendC) { trendC.data.labels=d.labels; trendC.data.datasets[0].data=d.moisture; trendC.update(); }
  else {
    const ctx=document.getElementById('trendChart').getContext('2d');
    const gr=ctx.createLinearGradient(0,0,0,180);
    gr.addColorStop(0,'rgba(61,122,79,.15)'); gr.addColorStop(1,'rgba(61,122,79,0)');
    trendC=new Chart(ctx,{type:'line',data:{labels:d.labels,datasets:[{label:'ADC',data:d.moisture,borderColor:g,backgroundColor:gr,borderWidth:2,tension:.4,fill:true,pointRadius:2,pointBackgroundColor:g}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:900},plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},maxTicksLimit:10}},y:{min:0,max:1023,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10}}}}}});
  }
  if (irrC) { irrC.data.labels=d.labels; irrC.data.datasets[0].data=d.irrigation; irrC.update(); }
  else {
    const ctx=document.getElementById('irrChart').getContext('2d');
    irrC=new Chart(ctx,{type:'bar',data:{labels:d.labels,datasets:[{data:d.irrigation,backgroundColor:'rgba(61,122,79,.65)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:700},plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},maxTicksLimit:10}},y:{beginAtZero:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,.04)'}}}}});
  }
  if (!pieC) {
    const ctx=document.getElementById('pieChart').getContext('2d');
    pieC=new Chart(ctx,{type:'doughnut',data:{labels:d.disease_labels,datasets:[{data:d.disease_values,backgroundColor:['#86EFAC','#FCA5A5','#FDE68A','#BFDBFE'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:900},plugins:{legend:{position:'bottom',labels:{font:{size:10},padding:8}}}}});
  }
  const lang = currentLang;
  document.getElementById('sc-avg').textContent      = d.summary.avg_moisture + '%';
  document.getElementById('sc-irr').textContent      = d.summary.total_irrigations + (lang==='ko'?'회':'x');
  document.getElementById('sc-disease').textContent  = d.summary.top_disease;
  document.getElementById('sc-interval').textContent = d.summary.avg_interval + (lang==='ko'?'시간':'h');
}

let currentRange = '24h';
async function loadAnalytics(range) {
  currentRange = range;
  const r = await fetch(`/api/analytics?range=${range}`).catch(()=>null);
  if (r) buildCharts(await r.json());
  document.getElementById('range-lbl').textContent = RL[range][currentLang];
}

document.querySelectorAll('.ptab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    loadAnalytics(btn.dataset.range);
  });
});

const idx = Math.floor(Math.random()*4);
const pTimes = {ko:['약 2시간 후','약 3시간 후','약 4시간 후','약 5시간 후'],en:['~2 hours','~3 hours','~4 hours','~5 hours']};
document.getElementById('pred-time').textContent = pTimes[currentLang][idx];
document.getElementById('pred-fill').style.width = ['80%','65%','50%','35%'][idx];

loadAnalytics('24h');
</script>
{% endblock %}
